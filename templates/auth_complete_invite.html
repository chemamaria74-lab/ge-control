<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Crear contraseña | GE Control</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/ge-brand.css">
  <style>
    :root{--wine:#751a2a;--wine-dark:#50101c;--ink:#20201f;--muted:#686460;--paper:#fffdfa;--line:#e5e0d9;--ok:#286748}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--ink);background:linear-gradient(145deg,#f8f4ef,#f0e5e5);font-family:var(--ge-font,Inter,system-ui,sans-serif)}
    main{width:min(100%,470px);padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 24px 60px rgba(64,32,34,.14)}
    .logo{display:block;width:164px;height:auto;margin-bottom:30px}h1{margin:0 0 9px;font-size:2rem;letter-spacing:-.035em}p{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:18px}label{font-weight:800;font-size:.88rem}input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #cec5bf;border-radius:8px;font:inherit}input:focus{outline:3px solid #d8bbc0;border-color:var(--wine)}button{width:100%;min-height:49px;margin-top:22px;border:0;border-radius:8px;color:#fff;background:var(--wine);font:inherit;font-weight:850;cursor:pointer}button:hover{background:var(--wine-dark)}button:disabled{opacity:.6;cursor:wait}.status{min-height:1.5em;margin:16px 0 0;font-size:.9rem}.status.error{color:#9a2035}.status.ok{color:var(--ok)}.hidden{display:none}.help{font-size:.82rem}.back{color:var(--wine);font-weight:750}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/static/img/ge-control-logo.svg" alt="GE Control">
    <section id="loading"><h1>Validando invitación</h1><p>Espera un momento…</p></section>
    <section id="formSection" class="hidden">
      <h1>Crea tu contraseña</h1>
      <p>Esta contraseña será la que usarás para entrar a GE Control.</p>
      <form id="passwordForm" novalidate>
        <div class="field"><label for="password">Contraseña nueva</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
        <button id="submitButton" type="submit">Guardar contraseña</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section id="invalid" class="hidden"><h1>El enlace ya no es válido</h1><p>La invitación pudo haber expirado o ya fue utilizada. Por seguridad, solicita un restablecimiento de contraseña desde soporte.</p><p class="help"><a class="back" href="/choice">Volver a GE Control</a></p></section>
  </main>
  <script id="supabaseConfig" type="application/json">{{ {"url": supabase_url, "key": supabase_publishable_key}|tojson }}</script>
  <script>
    (function () {
      'use strict';
      var config = JSON.parse(document.getElementById('supabaseConfig').textContent);
      var params = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var accessToken = params.get('access_token');
      var flowType = params.get('type');
      // Remove credentials from the address bar and browser history immediately.
      history.replaceState(null, document.title, window.location.pathname);

      var loading = document.getElementById('loading');
      var formSection = document.getElementById('formSection');
      var invalid = document.getElementById('invalid');
      var form = document.getElementById('passwordForm');
      var status = document.getElementById('status');
      var submit = document.getElementById('submitButton');

      function showInvalid() { loading.classList.add('hidden'); formSection.classList.add('hidden'); invalid.classList.remove('hidden'); accessToken = null; }
      function authHeaders() { return {'apikey': config.key, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'}; }
      if (!accessToken || !['invite', 'recovery'].includes(flowType)) { showInvalid(); return; }

      fetch(config.url + '/auth/v1/user', {headers: authHeaders(), cache: 'no-store'})
        .then(function (response) { if (!response.ok) throw new Error('invalid_session'); loading.classList.add('hidden'); formSection.classList.remove('hidden'); })
        .catch(showInvalid);

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var password = document.getElementById('password').value;
        var confirmation = document.getElementById('confirmPassword').value;
        status.className = 'status error';
        if (password.length < 8) { status.textContent = 'Usa al menos 8 caracteres.'; return; }
        if (password !== confirmation) { status.textContent = 'Las contraseñas no coinciden.'; return; }
        submit.disabled = true; status.textContent = 'Guardando…'; status.className = 'status';
        fetch(config.url + '/auth/v1/user', {method:'PUT', headers:authHeaders(), body:JSON.stringify({password:password}), cache:'no-store'})
          .then(function (response) { if (!response.ok) return response.json().catch(function(){return {};}).then(function(body){throw new Error(body.msg || body.message || 'No se pudo guardar.');}); return response.json(); })
          .then(function () {
            accessToken = null;
            form.reset();
            status.className = 'status ok'; status.textContent = 'Contraseña creada. Ya puedes iniciar sesión.';
            submit.textContent = 'Continuar'; submit.disabled = false; submit.type = 'button';
            submit.onclick = function(){ window.location.assign('/login/control-administrativo?portal=gastos&password_set=1'); };
          })
          .catch(function (error) { submit.disabled = false; status.className = 'status error'; status.textContent = error.message || 'No se pudo guardar la contraseña.'; });
      });
    })();
  </script>
</body>
</html>
