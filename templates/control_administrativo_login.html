<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GE Control | Empresas y personas</title>
  <link rel="icon" href="/static/img/favicon.svg"><link rel="stylesheet" href="/static/css/ge-brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(28px,6vh,70px) 18px 120px;background:#f5f5f5;color:#111;font-family:var(--ge-font,Inter,system-ui,sans-serif);display:flex;flex-direction:column;align-items:center}.logo{width:min(500px,76vw);margin:0 0 42px}.card{width:min(840px,100%);padding:clamp(34px,5vw,64px);background:#fff;border:1px solid #ded6ca;border-radius:18px;box-shadow:0 24px 55px rgba(29,23,18,.08);text-align:center}.card h1{margin:0;font-size:clamp(2rem,4vw,3rem)}.subtitle{margin:14px 0 42px;color:#756f68;font-size:clamp(1rem,2vw,1.5rem)}form{text-align:left}.field{display:grid;gap:10px;margin-bottom:24px}.field label{font-size:clamp(1rem,2vw,1.35rem);font-weight:900}.field input{width:100%;min-height:62px;padding:0 16px;border:1px solid #d8d0c4;border-radius:10px;background:#fff;font:inherit;font-size:1.1rem;outline:0}.field input:focus{border-color:#7a1e2c;box-shadow:0 0 0 3px rgba(122,30,44,.12)}button{width:100%;min-height:64px;margin-top:8px;border:0;border-radius:10px;background:#7a1e2c;color:#fff;font:inherit;font-size:1.25rem;font-weight:850;cursor:pointer}button:hover{background:#5b0f1d}button:disabled{opacity:.65}.error{min-height:24px;margin:14px 0 0;color:#a22b36;text-align:center}.back{display:inline-block;margin-top:42px;color:#6a1120;text-decoration:none;font-size:1.15rem;font-weight:900}.back:hover{text-decoration:underline}@media(max-width:600px){body{justify-content:center;padding:28px 16px 110px}.logo{width:min(310px,82vw);margin-bottom:28px}.card{padding:30px 22px;border-radius:14px}.subtitle{margin-bottom:28px}.field{margin-bottom:18px}.field input{min-height:54px}button{min-height:56px;font-size:1rem}.back{margin-top:28px;font-size:1rem}}
  </style>
</head><body>
  <img class="logo" src="/static/img/ge-control-logo.svg" alt="GE Control">
  <main class="card"><h1>Empresas y personas</h1><p class="subtitle">Acceso con usuario y contraseña</p>
    <form id="loginForm"><div class="field"><label for="loginUser">Usuario</label><input id="loginUser" autocomplete="username" required autofocus></div><div class="field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button id="loginButton" type="submit">Entrar</button></form>
    <div id="loginError" class="error" role="alert"></div><a class="back" href="/choice">Cambiar acceso</a>
  </main>
  <script src="/static/js/session_timeout.js?v=two-hour-control-20260804"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('loginButton'),error=document.getElementById('loginError'),username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;error.textContent='';button.disabled=true;button.textContent='Verificando…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,modulo:'control_administrativo'})}),data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.detail||'Usuario o contraseña incorrectos.');localStorage.setItem('sat_token',data.token);localStorage.setItem('zc_token',data.token);localStorage.setItem('sat_user_id',data.user_id||'');localStorage.setItem('sat_modulo','control_administrativo');if(data.display_name)localStorage.setItem('sat_display_name',data.display_name);window.GESessionTimeout?.markLogin();location.replace('/control-administrativo')}catch(err){error.textContent=err.message||'No se pudo iniciar sesión.';button.disabled=false;button.textContent='Entrar'}});
  </script>
</body></html>
