<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GE Control | Administrador de empresas · {{ portal_title }}</title>
  <link rel="icon" href="/static/img/favicon.svg"><link rel="stylesheet" href="/static/css/ge-brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;color:#111;font-family:var(--ge-font,Inter,system-ui,sans-serif);padding:24px}.page{width:min(460px,100%)}.logo{width:280px;max-width:82vw;display:block;margin:0 auto 26px}.card{background:#fff;border:1px solid #e7e3dc;border-radius:8px;padding:28px;box-shadow:0 14px 36px rgba(17,17,17,.08);text-align:left}.card h1{font-size:24px;margin:0 0 6px;text-align:center}.subtitle{margin:0 0 18px;color:#6f6a64;line-height:1.45;text-align:center}.portal-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 0 20px;padding:4px;border-radius:9px;background:#f0ece7}.portal-tab{padding:10px 8px;border-radius:7px;color:#6f6a64;text-align:center;text-decoration:none;font-weight:800}.portal-tab:hover{color:#7a1e2c}.portal-tab.active{background:#fff;color:#7a1e2c;box-shadow:0 2px 8px rgba(17,17,17,.08)}.field{margin:14px 0 0}.field label{display:block;font-weight:800;margin:0 0 6px}.field input{width:100%;border:1px solid #ddd4c8;border-radius:7px;padding:12px 13px;font:inherit;outline:0}.field input:focus{border-color:#7a1e2c;box-shadow:0 0 0 3px rgba(122,30,44,.12)}button{width:100%;margin-top:18px;border:0;border-radius:7px;padding:13px 16px;background:#7a1e2c;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:hover{background:#5b0f1d}button:disabled{opacity:.65}.error{min-height:20px;margin-top:12px;color:#a22b36;text-align:center}.back{display:block;margin-top:16px;color:#5b0f1d;text-decoration:none;font-weight:800;text-align:center}.back:hover{text-decoration:underline}
  </style>
</head><body>
  <main class="page">
    <img class="logo" src="/static/img/ge-control-logo.svg" alt="GE Control">
    <section class="card"><h1>Administrador de empresas</h1><p class="subtitle">Acceso a {{ portal_title }}</p>
      <nav class="portal-tabs" aria-label="Módulo administrativo">
        <a class="portal-tab{% if portal_slug == 'gastos' %} active{% endif %}" href="/login/control-administrativo?portal=gastos"{% if portal_slug == 'gastos' %} aria-current="page"{% endif %}>Gastos y pagos</a>
        <a class="portal-tab{% if portal_slug == 'facturacion' %} active{% endif %}" href="/login/control-administrativo?portal=facturacion"{% if portal_slug == 'facturacion' %} aria-current="page"{% endif %}>Facturación</a>
      </nav>
      <form id="loginForm"><div class="field"><label for="loginUser">Usuario</label><input id="loginUser" autocomplete="username" required autofocus></div><div class="field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button id="loginButton" type="submit">Entrar</button></form>
      <div id="loginError" class="error" role="alert"></div><a class="back" href="/choice">Cambiar acceso</a>
    </section>
  </main>
  <script src="/static/js/session_timeout.js?v=two-hour-control-20260804"></script>
  <script>
    const LOGIN_NEXT = {{ login_next|tojson }};
    document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('loginButton'),error=document.getElementById('loginError'),username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;error.textContent='';button.disabled=true;button.textContent='Verificando…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,modulo:'control_administrativo'})}),data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.detail||'Usuario o contraseña incorrectos.');localStorage.setItem('sat_token',data.token);localStorage.setItem('zc_token',data.token);localStorage.setItem('sat_user_id',data.user_id||'');localStorage.setItem('sat_modulo','control_administrativo');if(data.display_name)localStorage.setItem('sat_display_name',data.display_name);window.GESessionTimeout?.markLogin();location.replace(LOGIN_NEXT)}catch(err){error.textContent=err.message||'No se pudo iniciar sesión.';button.disabled=false;button.textContent='Entrar'}});
  </script>
</body></html>
