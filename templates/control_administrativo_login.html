<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GE Control | Administrador de empresas</title>
  <link rel="icon" href="/static/img/favicon.svg"><link rel="stylesheet" href="/static/css/ge-brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;font-family:var(--ge-font,Inter,system-ui,sans-serif);padding:22px;color:#111}.card{width:min(470px,100%);background:#fff;border:1px solid #e7e3dc;border-radius:8px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.14)}.logo{width:190px;display:block;margin:0 auto 20px}.card h1{font-size:22px;margin:0 0 4px;text-align:center}.subtitle{text-align:center;color:#6f6a64;margin:0 0 18px}.portal-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;background:#f2eee8;border-radius:9px;padding:4px;margin-bottom:20px}.portal-tab{width:auto;margin:0;border:0;border-radius:7px;padding:10px 4px;background:transparent;color:#6f6a64;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.portal-tab:hover{color:#7a1e2c}.portal-tab.active{background:#fff;color:#7a1e2c;box-shadow:0 2px 8px rgba(0,0,0,.08)}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:#6f6a64;margin:0 0 6px}.field input{width:100%;border:1px solid #d8d0c4;border-radius:8px;padding:13px 14px;font:inherit;outline:0}.field input:focus{border-color:#7a1e2c;box-shadow:0 0 0 3px rgba(122,30,44,.12)}.login-button{width:100%;border:0;border-radius:8px;background:#7a1e2c;color:#fff;padding:13px;font:inherit;font-weight:800;cursor:pointer}.login-button:hover{background:#5b0f1d}.login-button:disabled{opacity:.65}.error{color:#b91c1c;font-size:13px;min-height:18px;margin:12px 0;text-align:center;font-weight:700}.back{display:block;color:#5b0f1d;text-decoration:none;font-weight:800;text-align:center}.back:hover{text-decoration:underline}@media(max-width:420px){.card{padding:24px 17px}.portal-tab{font-size:11px}}
  </style>
</head><body>
  <main class="card">
    <img class="logo" src="/static/img/ge-control-logo.svg" alt="GE Control">
    <h1>Administrador de empresas</h1>
    <p class="subtitle" id="portalDescription">Gastos, pagos y control administrativo.</p>
    <div class="portal-tabs" role="tablist" aria-label="Módulo administrativo">
      <button class="portal-tab" type="button" data-portal="gastos" role="tab">Gastos y pagos</button>
      <button class="portal-tab" type="button" data-portal="facturacion" role="tab">Facturación</button>
    </div>
    <form id="loginForm"><div class="field"><label for="loginUser">Usuario</label><input id="loginUser" autocomplete="username" required autofocus></div><div class="field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="login-button" id="loginButton" type="submit">Entrar</button></form>
    <div id="loginError" class="error" role="alert"></div><a class="back" href="/choice">Cambiar acceso</a>
  </main>
  <script src="/static/js/session_timeout.js?v=two-hour-control-20260804"></script>
  <script>
    const PORTALS={gastos:{description:'Gastos, pagos y control administrativo.',destination:'/control-administrativo'},facturacion:{description:'Facturas, clientes, productos y programaciones.',destination:'/control-administrativo/facturacion'}};
    let selectedPortal={{ portal_slug|tojson }};
    if(!PORTALS[selectedPortal])selectedPortal='gastos';
    const portalDescription=document.getElementById('portalDescription'),portalError=document.getElementById('loginError');
    document.querySelectorAll('[data-portal]').forEach(button=>button.onclick=()=>{selectedPortal=button.dataset.portal;document.querySelectorAll('[data-portal]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-selected',String(active))});portalDescription.textContent=PORTALS[selectedPortal].description;portalError.textContent=''});
    document.querySelector(`[data-portal="${selectedPortal}"]`).click();
    document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('loginButton'),error=document.getElementById('loginError'),username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;error.textContent='';button.disabled=true;button.textContent='Verificando…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,modulo:'control_administrativo'})}),data=await response.json().catch(()=>({}));if(!response.ok||!data.success)throw new Error(data.detail||'Usuario o contraseña incorrectos.');localStorage.setItem('sat_token',data.token);localStorage.setItem('zc_token',data.token);localStorage.setItem('sat_user_id',data.user_id||'');localStorage.setItem('sat_modulo','control_administrativo');if(data.display_name)localStorage.setItem('sat_display_name',data.display_name);window.GESessionTimeout?.markLogin();location.replace(PORTALS[selectedPortal].destination)}catch(err){error.textContent=err.message||'No se pudo iniciar sesión.';button.disabled=false;button.textContent='Entrar'}});
  </script>
</body></html>
