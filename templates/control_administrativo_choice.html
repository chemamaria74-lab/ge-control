<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GE CONTROL - Empresas y personas</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/ge-brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;color:#111;font-family:var(--ge-font,Inter,system-ui,sans-serif);padding:24px}.shell{width:min(760px,100%)}.logo{width:300px;max-width:82vw;display:block;margin:0 auto 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.portal-card{background:#fff;border:1px solid #e7e3dc;border-radius:8px;padding:24px;text-decoration:none;color:#111;box-shadow:0 14px 36px rgba(17,17,17,.08)}.portal-card:hover{border-color:#c8a96b}.portal-card h2{font-size:22px;margin:0 0 8px}.portal-card p{margin:0;color:#6f6a64;line-height:1.45}.back{display:inline-block;margin-top:18px;color:#5b0f1d;text-decoration:none;font-weight:700}@media(max-width:680px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <img class="logo" src="/static/img/ge-control-logo.svg" alt="GE Control">
    <section class="grid" aria-label="Portales disponibles">
      <a class="portal-card" href="/login/control-administrativo?portal=gastos">
        <h2>Gastos y pagos</h2><p>Captura gastos, administra catálogos, prepara pagos y consulta el análisis de la empresa.</p>
      </a>
      <a class="portal-card" href="/login/control-administrativo?portal=facturacion">
        <h2>Facturación</h2><p>Genera, timbra, programa y envía facturas generales para tu empresa o persona física.</p>
      </a>
    </section>
    <a class="back" href="/choice">Cambiar módulo</a>
  </main>
</body>
</html>
