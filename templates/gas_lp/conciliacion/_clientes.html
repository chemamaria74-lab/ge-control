    <section class="section" data-section="clientes">
      <div class="panel">
        <div class="section-head compact-head">
          <div><h2>Clientes</h2><div class="muted small">Catálogo compartido con las asistentes de facturación de la empresa seleccionada.</div></div>
          <div class="toolbar"><span class="pill neutral" id="concClientesCount">0 clientes</span><button class="btn ghost" type="button" onclick="loadConciliacionClientes(true)"><i class="fa-solid fa-magnifying-glass"></i> Buscar clientes</button><button class="btn" type="button" onclick="toggleConciliacionClienteForm(true)"><i class="fa-solid fa-user-plus"></i> Agregar cliente</button></div>
        </div>
        <form id="concClienteForm" class="client-create-panel hidden" onsubmit="saveConciliacionCliente(event)">
          <div class="client-form-grid">
            <div><label>RFC</label><input id="concCliRfc" maxlength="13" required oninput="this.value=this.value.toUpperCase().trim()" placeholder="RFC del receptor"></div>
            <div><label>Nombre fiscal</label><input id="concCliNombre" required placeholder="Razón social"></div>
            <div><label>Código postal</label><input id="concCliCp" inputmode="numeric" maxlength="5" required placeholder="00000"></div>
            <div><label>Régimen fiscal</label><select id="concCliRegimen"><option value="601">601 · General de Ley Personas Morales</option><option value="603">603 · Personas Morales con Fines no Lucrativos</option><option value="605">605 · Sueldos y Salarios</option><option value="606">606 · Arrendamiento</option><option value="612">612 · Actividades Empresariales y Profesionales</option><option value="616">616 · Sin obligaciones fiscales</option><option value="621">621 · Incorporación Fiscal</option><option value="625">625 · Plataformas Tecnológicas</option><option value="626">626 · Régimen Simplificado de Confianza</option></select></div>
            <div><label>Uso CFDI</label><select id="concCliUso"><option value="G01">G01 · Adquisición de mercancías</option><option value="G02">G02 · Devoluciones, descuentos o bonificaciones</option><option value="G03" selected>G03 · Gastos en general</option><option value="S01">S01 · Sin efectos fiscales</option></select></div>
            <div><label>Correo principal</label><input id="concCliEmail" type="email" placeholder="cliente@empresa.com"></div>
          </div>
          <div class="toolbar client-form-actions"><button class="btn" id="btnConcGuardarCliente" type="submit"><i class="fa-solid fa-floppy-disk"></i> Guardar cliente</button><button class="btn ghost" type="button" onclick="toggleConciliacionClienteForm(false)">Cancelar</button></div>
        </form>
        <div id="concClientesMsg" class="status" aria-live="polite"></div>
        <div class="client-search"><label>Buscar cliente</label><input id="concClienteSearch" placeholder="Nombre, RFC, CP, régimen, uso CFDI o correo" oninput="renderConciliacionClientes()"></div>
        <div class="table-wrap clientes-catalogo-scroll"><table><thead><tr><th>Cliente</th><th>RFC</th><th>CP</th><th>Régimen</th><th>Uso CFDI</th><th>Correo</th><th>Crédito</th></tr></thead><tbody id="concClientesRows"><tr><td colspan="7">Presiona Buscar clientes para cargar el catálogo.</td></tr></tbody></table></div>
      </div>
    </section>
