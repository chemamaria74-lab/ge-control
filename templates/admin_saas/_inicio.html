      <span class="eyebrow">Portal Transporte</span>

      <p>Da de alta clientes, revisa suscripciones y atiende pendientes sin entrar a herramientas técnicas.</p>
    </div>
    <button class="btn btn-lg" onclick="openCustomerOnboarding()"><i class="fa-solid fa-plus"></i> Dar de alta cliente</button>

  <div class="business-kpis" id="businessKpis"></div>

    <section class="card">
      <div class="section-heading">
        <div><span class="eyebrow">Catálogo</span><h3>Planes de Portal Transporte</h3></div>
        <button class="text-button" onclick="openCommercial('catalog')">Ver planes</button>

    </section>
  </div>
